# Provenance-aware marine dynamics contract for the current visual/physics vehicle.
# The visual asset contains four horizontal and four vertical thrusters. This is
# an 8-thruster Heavy-like configuration, not standard 6-thruster BlueROV2 truth.
vehicle_version: bluerov2_heavy_like_8_thruster
visual_source: "bvibhav/stonefish_bluerov2@6448383af6b7ef6083b0eac2c08102660591e318"
coordinate_frame: "body x-forward, y-left, z-up; wxyz quaternions"
presets:
  fast_rl:
    added_mass_mode: none
    added_mass_coriolis: false
    notes: "Buoyancy, restoring, relative-current damping, thrusters, and lag; no added-mass coupling."
  hydro_rl:
    added_mass_mode: diagonal
    added_mass_coriolis: true
    notes: "Diagonal added mass is an explicit approximation and is NOT YET VALIDATED for this vehicle."
  reference:
    added_mass_mode: full_matrix
    added_mass_coriolis: true
    notes: "Full-matrix interface and diagnostics; values remain unvalidated until replay/calibration."

